<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Saya</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
    }
    /* Loading screen agar transisi mulus */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loader p {
      margin-top: 12px;
      color: #64748b;
      font-size: 14px;
    }
    /* Frame tempat aplikasi Apps Script berjalan */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Screen Loading Halus -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat aplikasi...</p>
  </div>

  <!-- Embed Apps Script -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbx2q8kL8uDQ7wJDnal1dZvxuXIeTr4e4m1IFCMVWYqVQ5guUnti1TMbDSbqEzU3Fx9b/exec" 
    allow="geolocation; microphone; camera"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      loader.style.visibility = 'hidden';
    }
  </script>
</body>
</html>
